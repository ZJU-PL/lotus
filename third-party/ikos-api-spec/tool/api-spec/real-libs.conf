# System dependency libraries for the differential gate's real side.
#
# One library per line, priority = file order (a symbol defined by an
# earlier line wins).  Fields are tab-separated:
#
#     label <TAB> soname-or-absolute-path [<TAB> link args]
#
# sonames resolve through the ldconfig cache to the absolute file, so
# the generated map pins the version and never depends on -dev
# symlinks.  Link args `-` marks a library the real link already
# includes implicitly (libc, libm); any other args are passed verbatim
# after the implicit ones; an omitted field means "absolute path plus
# rpath", the right default for shared objects.
#
# A library missing from this machine warns and its functions read as
# no-real-lib -- add a line (or install the library) to extend the
# gate's reach.  Project-local artifacts (in-tree .a/.so) live in
# per-project real-libs.tsv maps and always take priority over these.
#	label	soname	args
libc	libc.so.6	-
libm	libm.so.6	-
libgcc_s	libgcc_s.so.1
libstdc++	libstdc++.so.6
libglib	libglib-2.0.so.0
libgobject	libgobject-2.0.so.0
libcrypto	libcrypto.so.3
libssl	libssl.so.3
libxml2	libxml2.so.2
zlib	libz.so.1
zstd	libzstd.so.1
libevent	libevent-2.1.so.7
libevent_pthreads	libevent_pthreads-2.1.so.7
lz4	liblz4.so.1
libtiff	libtiff.so.6
libpng	libpng16.so.16
libjpeg	libjpeg.so.8
readline	libreadline.so.8
dbus	libdbus-1.so.3
cairo	libcairo.so.2
sqlite3	libsqlite3.so.0
